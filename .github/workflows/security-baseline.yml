name: Security Baseline

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "HTTPS URL to scan (staging/prod-like)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  zap-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ inputs.target_url }}
          rules_file_name: ".zap/rules.tsv"
          cmd_options: "-a"
