name: Deploy Production

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PRODUCTION_SSH_KEY }}

      - name: Add production host to known_hosts
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          HOST="$(printf '%s' "${PRODUCTION_HOST}" | tr -d '\r\n' | xargs)"
          PORT="$(printf '%s' "${PRODUCTION_PORT}" | tr -d '\r\n' | xargs)"
          ssh-keyscan -p "${PORT}" "${HOST}" >> ~/.ssh/known_hosts

      - name: Deploy and migrate
        id: deploy
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_PORT: ${{ secrets.PRODUCTION_PORT }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_APP_DIR: ${{ secrets.PRODUCTION_APP_DIR }}
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          HOST="$(printf '%s' "${PRODUCTION_HOST}" | tr -d '\r\n' | xargs)"
          PORT="$(printf '%s' "${PRODUCTION_PORT}" | tr -d '\r\n' | xargs)"
          USER="$(printf '%s' "${PRODUCTION_USER}" | tr -d '\r\n' | xargs)"
          APP_DIR="$(printf '%s' "${PRODUCTION_APP_DIR}" | tr -d '\r\n' | xargs)"
          PUBLIC_HEALTH_URL="$(printf '%s' "${PRODUCTION_HEALTHCHECK_URL}" | tr -d '\r\n' | xargs)"
          LOCAL_HEALTH_URL="http://127.0.0.1:3000/api/health"

          if [ -z "${APP_DIR}" ]; then
            echo "PRODUCTION_APP_DIR is empty after trimming whitespace."
            exit 1
          fi

          OPTIONAL_PUBLIC_CHECK=""
          if [ -n "${PUBLIC_HEALTH_URL}" ]; then
            OPTIONAL_PUBLIC_CHECK="
              echo 'Optional public health check: ${PUBLIC_HEALTH_URL}'
              curl --silent --show-error --max-time 15 $(printf '%q' "${PUBLIC_HEALTH_URL}") \\
                && echo 'Public health check passed.' \\
                || echo 'Public health check failed (often Cloudflare 525 until nginx-proxy/Lets Encrypt is ready). Deploy is still OK if local check passed.'
            "
          fi

          ssh -p "${PORT}" "${USER}@${HOST}" "
            set -euo pipefail
            cd $(printf '%q' "${APP_DIR}")
            test -f .env
            git fetch origin
            git checkout main
            git reset --hard origin/main
            grep -E '^NEXT_PUBLIC_|^PLAUSIBLE_API_HOST' .env > web/.env.production
            docker compose -f docker-compose.production.yml --env-file .env build web
            docker compose -f docker-compose.production.yml --env-file .env up -d web
            docker compose -f docker-compose.production.yml --env-file .env exec -T web pnpm --dir web db:migrate

            echo 'Waiting for app health on localhost:3000...'
            for attempt in \$(seq 1 30); do
              if curl --fail --show-error --silent $(printf '%q' "${LOCAL_HEALTH_URL}"); then
                echo 'Local health check passed.'
                break
              fi
              if [ \"\${attempt}\" -eq 30 ]; then
                echo 'Local health check failed after 30 attempts.'
                docker compose -f docker-compose.production.yml --env-file .env logs --tail=80 web || true
                exit 1
              fi
              sleep 2
            done
            ${OPTIONAL_PUBLIC_CHECK}
          " | tee production-deploy.log

      - name: Upload deploy logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: production-deploy-logs
          path: production-deploy.log
          retention-days: 7
